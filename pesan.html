<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav>
        <div class="logo">
            <img src="Image/logo.png">
            <span><a href="index.html">Matahari Jaya Steel</a></span>
        </div>

        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="produk.html">Produk</a></li>
            <li><a href="tentang.html">Tentang</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <div class="produk-menu">
        <a href="produk.html" class="btn-menu">
            📋 Katalog Produk
        </a>

        <a href="pesan.html" class="btn-menu active">
            🛒 Pesan Produk
        </a>
    </div>

    <section class="max-w-3xl mx-auto mt-12 bg-white rounded-xl shadow-xl p-8">

        <h2 class="text-3xl font-bold text-center mb-2">
        Pesan Produk
        </h2>

        <p class="text-center text-gray-500 mb-8">
        Silakan isi formulir berikut untuk melakukan pemesanan produk.
        </p>

        <form id="formPesan" onsubmit="return validasiPesanan()">
            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Nama Lengkap
                </label>

                <input
                id="nama"
                type="text"
                class="w-full border rounded-lg p-3">

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Nama Perusahaan
                </label>

                <input
                id="perusahaan"
                type="text"
                class="w-full border rounded-lg p-3">

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Email
                </label>

                <input
                id="email"
                type="email"
                class="w-full border rounded-lg p-3">

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Nomor WhatsApp
                </label>

                <input
                id="phone"
                type="text"
                class="w-full border rounded-lg p-3">

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Produk
                </label>

                <select
                id="produk"
                class="w-full border rounded-lg p-3">

                    <option value="">Pilih Produk</option>
                    <option>Plat</option>
                    <option>Siku</option>
                    <option>Hollow</option>
                    <option>Pipa Hitam</option>
                    <option>Besi Beton</option>
                    <option>CNP</option>

                </select>

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Ukuran / Spesifikasi
                </label>

                <input
                id="ukuran"
                type="text"
                placeholder="Contoh : Plat 4 x 8"
                class="w-full border rounded-lg p-3">

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Jumlah
                </label>

                <input
                id="jumlah"
                type="number"
                class="w-full border rounded-lg p-3">

            </div>

            <div class="mb-5">

                <label class="font-semibold block mb-2">
                Alamat Pengiriman
                </label>

                <textarea
                id="alamat"
                rows="4"
                class="w-full border rounded-lg p-3"></textarea>

            </div>

            <div class="mb-6">

                <label class="font-semibold block mb-2">
                Catatan Tambahan
                </label>

                <textarea
                id="catatan"
                rows="4"
                class="w-full border rounded-lg p-3"></textarea>

            </div>

            <button class="w-full bg-yellow-700 text-white p-3 rounded-lg hover:bg-yellow-800 duration-300">Kirim Pesanan</button>

        </form>

    </section>

    <footer>
    <p>© 2026 Matahari Jaya Steel</p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="JS/script.js"></script>

</body>
</html>
